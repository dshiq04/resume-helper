# ResumeTrail portable configuration
#
# By default the application keeps everything inside its own folder:
#
#   ResumeTrail/
#   ├── resume-helper.exe
#   ├── config.yaml          <- this file
#   └── resume-helper.db     <- default SQLite database
#
# Nothing is written to AppData, Documents or other system directories.
# During `go run .` the project root is used instead of the executable folder.
#
# Copy this file to ./config.yaml next to the executable (or set
# RESUME_HELPER_CONFIG to a custom path) and restart the application.
#
# Tip: you can configure SQLite / MySQL / PostgreSQL graphically from
# Settings > Database inside the app, including a connection test. Saving
# there updates this file and switches the connection without a restart.
#
# Application passwords are NOT configured here. Enable or disable the
# optional password from Settings inside the app; it is stored as a bcrypt
# hash in the database.

server:
  host: 127.0.0.1
  port: 19876

database:
  # sqlite | mysql | postgres
  driver: sqlite

  # SQLite: empty means resume-helper.db next to this config file.
  # Relative paths are resolved next to this config file as well.
  dsn: ""

  # MySQL example:
  # driver: mysql
  # dsn: "user:password@tcp(127.0.0.1:3306)/resume_helper?charset=utf8mb4&parseTime=True&loc=Local"

  # PostgreSQL example:
  # driver: postgres
  # dsn: "host=127.0.0.1 user=postgres password=secret dbname=resume_helper port=5432 sslmode=disable TimeZone=Local"
