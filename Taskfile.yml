version: '3'

vars:
  APP_NAME: "resume-helper"
  BIN_DIR: "bin"

tasks:
  install:
    summary: Install frontend dependencies
    dir: frontend
    cmds:
      - npm install

  frontend:build:
    summary: Type-check and build the React frontend
    dir: frontend
    cmds:
      - npm run build

  frontend:dev:
    summary: Run the Vite dev server on port 9245
    dir: frontend
    cmds:
      - npm run dev

  build:
    summary: Build the self-contained desktop binary
    deps:
      - frontend:build
    cmds:
      - go build -trimpath -ldflags="-s -w" -o "{{.BIN_DIR}}/{{.APP_NAME}}.exe" .

  run:
    summary: Run the desktop application (requires a built frontend/dist)
    cmds:
      - go run .

  server:
    summary: Run only the Gin server for browser preview (headless)
    cmds:
      - go run . --headless

  test:
    summary: Run Go tests
    cmds:
      - go test ./...
